// Kafka Server JAAS Configuration
// This file configures SASL authentication for the Kafka broker
// Using KRaft mode (no Zookeeper) - Client section not needed

// KafkaServer: Defines users and credentials for Kafka clients
KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_producer="producer-secret"
    user_consumer="consumer-secret"
    user_backend="backend-secret";
};
