# =============================================================================
# DOCKER COMPOSE - FULL STACK LEARNING LAB
# =============================================================================
# This compose file sets up 4 services for learning Redis and Kafka:
# 1. PostgreSQL - Relational database for persistent data
# 2. Redis - In-memory cache and message broker
# 3. Kafka - Distributed event streaming platform (KRaft mode, no Zookeeper)
# 4. Backend - Node.js Express API
# 5. Frontend - React application
# =============================================================================

services:
  # ===========================================================================
  # POSTGRESQL - Relational Database
  # ===========================================================================
  # WHAT: PostgreSQL is a powerful, open-source relational database
  # WHY: Stores persistent data (users, orders, etc.) that must survive restarts
  # HOW: We use the official Postgres image with a custom init script
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass123
      POSTGRES_DB: labdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d labdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-network

  # ===========================================================================
  # REDIS - In-Memory Data Store
  # ===========================================================================
  # WHAT: Redis is an in-memory key-value store (super fast, ~1ms latency)
  # WHY USE CASES:
  #   1. CACHING - Store frequently accessed data to reduce DB load
  #   2. SESSION STORAGE - Store user sessions (fast, auto-expiring)
  #   3. RATE LIMITING - Count requests per user/IP
  #   4. PUB/SUB - Simple message passing (lighter than Kafka)
  #   5. LEADERBOARDS - Sorted sets for rankings
  # HOW: We expose port 6379 and use redis-cli to interact
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-network

  # ===========================================================================
  # KAFKA - Distributed Event Streaming Platform (KRaft mode, no Zookeeper)
  # ===========================================================================
  # WHAT: Kafka is a distributed event streaming platform for high-throughput
  # WHY USE CASES:
  #   1. EVENT SOURCING - Log all changes to data
  #   2. MESSAGE QUEUE - Decouple services (producer/consumer pattern)
  #   3. LOG AGGREGATION - Collect logs from multiple services
  #   4. STREAM PROCESSING - Real-time data processing
  #   5. COMMIT LOG - Distributed commit log for replication
  # HOW: 
  #   - Topics: Categories for messages (like a folder)
  #   - Producers: Send messages to topics
  #   - Consumers: Read messages from topics
  #   - Partitions: Split topics for parallelism
  #   - Offsets: Position of consumer in a partition
  # NOTE: Using KRaft mode (no Zookeeper) for simpler setup
  # ===========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: lab-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft mode configuration (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      
      # LISTENERS: How clients connect to Kafka
      # PLAINTEXT (9092) - For internal Docker network (no auth for simplicity)
      # SASL_PLAINTEXT (9093) - For connections with authentication (internal and external)
      # CONTROLLER (29093) - For KRaft controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SASL_PLAINTEXT://kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,SASL_PLAINTEXT://:9093,CONTROLLER://:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # SASL/PLAIN AUTHENTICATION CONFIGURATION (for SASL_PLAINTEXT listener only)
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      
      # JAAS Configuration - Defines users and passwords for Kafka clients
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      
      # KRaft cluster ID
      KAFKA_KRAFT_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Log directory
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single-node configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka/config/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf:ro
    healthcheck:
      # Simple healthcheck without authentication (uses PLAINTEXT listener)
      test: 
        - CMD
        - /opt/kafka/bin/kafka-broker-api-versions.sh
        - --bootstrap-server
        - localhost:9092
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - lab-network

  # ===========================================================================
  # KAFKA UI - Web Interface for Kafka (Optional but helpful for learning)
  # ===========================================================================
  # WHAT: Web UI to view topics, messages, and consumers
  # WHY: Makes it easy to see what's happening in Kafka
  # HOW: Access at http://localhost:8080
  # ===========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lab-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab-cluster
      # Use PLAINTEXT listener for UI (no auth needed for internal Docker network)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Authentication for Kafka UI Web Interface
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "admin"
      SPRING_SECURITY_USER_PASSWORD: "admin123"
    networks:
      - lab-network

  # ===========================================================================
  # BACKEND - Node.js Express API
  # ===========================================================================
  # WHAT: REST API that demonstrates Redis caching and Kafka messaging
  # WHY: Shows practical integration patterns
  # HOW: Connects to PostgreSQL, Redis, and Kafka
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lab-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      
      # PostgreSQL connection
      DATABASE_URL: postgresql://labuser:labpass123@postgres:5432/labdb
      
      # Redis connection
      REDIS_URL: redis://redis:6379
      
      # Kafka connection
      # OPTION 1: Local Kafka without auth (internal Docker network)
      # KAFKA_BROKERS: kafka:9092
      
      # OPTION 2: Local Kafka with SASL auth (simulate Confluent Cloud)
      KAFKA_BROKERS: kafka:9093
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_USERNAME: backend
      KAFKA_SASL_PASSWORD: backend-secret
      KAFKA_SSL_ENABLED: "false"  # Set to "true" for real Confluent Cloud
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - lab-network

  # ===========================================================================
  # FRONTEND - React Application
  # ===========================================================================
  # WHAT: Web UI to interact with all services
  # WHY: Visual demonstration of Redis and Kafka functionality
  # HOW: Calls backend API, shows real-time updates
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lab-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - lab-network

# =============================================================================
# NETWORKS - Isolated network for all services
# =============================================================================
networks:
  lab-network:
    driver: bridge

# =============================================================================
# VOLUMES - Persistent storage
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  kafka_data:
